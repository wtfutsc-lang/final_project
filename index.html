
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wizz Air Booking</title>
  <link rel="stylesheet" href="./styles/style.css" />
</head>
<body>


  <header class="navbar">
    <div class="logo">WIZZ</div>
    <div class="auth">
      <a href="./formSignIn.html">Войти</a>
    </div>
  </header>

  <main>
<div class="fon">
<div class="container">
       
<form  method="post"  class="trip-form">   
  <fieldset class="form-grid-2x">
    <div class="group-field">
      <label for="from" class="bold-type">From</label>
      <select id="from" class="from-place" name="from" required>
        <option value="" disabled selected hidden>country</option>
        <option value="minsk">minsk</option>
        <option value="brest">krakov</option>
        <option value="brest">tallin</option>
      </select>
    </div>

    <div class="group-field">
      <label for="to-place" class="bold-type">To</label>
      <select class="from-place" id="to-place" name="to" required>
        <option value="" disabled selected hidden>country</option>
        <option value="minsk">minsk</option>
        <option value="brest">krakov</option>
        <option value="brest">tallin</option>
      </select>
    </div>
  </fieldset>

  <fieldset class="form-grid-2x">
    <div class="group-field">
      <label for="depart" class="bold-type">Depart on</label>
      <input placeholder="Pick a date" type="date" name="depart" id="depart" />
    </div>

    <div class="group-field">
      <label for="return" class="bold-type">Return on</label>
      <input placeholder="Pick a date" type="date" name="return" id="return" />
    </div>
  </fieldset>
  
  <fieldset class="form-grid-passengers">
    <div class="group-select-field">
      <label for="adults" class="bold-type">Adults</label> 
      <select name="adults" class="ticket-count" id="adults">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
      </select>
    </div>

    <div class="group-select-field">
      <label for="children" class="bold-type">Children <span class="label-hint">(2-11 yrs)</span></label>
      <select name="children" class="ticket-count" id="children">
        <option value="0">0</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
      </select>
    </div>

    <div class="group-select-field">
      <label for="infants" class="bold-type">Infants <span class="label-hint">(Below 2 yrs)</span></label>
      <select name="infants" class="ticket-count" id="infants">
        <option value="0">0</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
      </select>
    </div>
  </fieldset>

  <fieldset class="more-option">
    <div class="group-field">
      <label for="plane-class" class="bold-type">Class of travel</label>
      <select name="class-of-travel" class="travel-class-select" id="plane-class">
        <option value="economy">Economy</option>
        <option value="business">Business class</option>
        <option value="firstClass">First class</option>
      </select>
    </div>
  </fieldset>
  
  <div class="form-footer">
    <input class="search-btn" type="submit" value="Search flights"/>
  </div>
</form>
      </div>
    </div>

    <div class="flex-wrapper">
      
      <div class="card-container">
        <div class="card">
          <div class="card-image">
            <img src="./public/tal.jpg" alt="Minsk">
            <span class="badge">NEW</span>
          </div>
          <div class="card-content">
            <div class="card-header">
              <h2>Tallin</h2>
              <span class="country">Estonia</span>
            </div>
            <p>Very informative sentence about Minsk.</p>
            <div class="card-footer">
              <span class="price">$450</span>
              <a href="cities.html?name=tallinn" class="buy-btn" style="text-decoration: none;">more</a>
            </div>
          </div>
        </div>
      </div>

    
      <div class="card-container">
        <div class="card">
          <div class="card-image">
            <img src="./public/krakov1.jpg" alt="Minsk">
            <span class="badge">NEW</span>
          </div>
          <div class="card-content">
            <div class="card-header">
              <h2>Krakov</h2>
              <span class="country">Poland</span>
            </div>
            <p>Very informative sentence about Krakov.</p>
            <div class="card-footer">
              <span class="price">$450</span>
              <a href="cities.html?name=krakow" class="buy-btn" style="text-decoration: none;">more</a>
            </div>
          </div>
        </div>
      </div>

      
      <div class="card-container">
        <div class="card">
          <div class="card-image">
            <img src="./public/minsk1.jpg" alt="Minsk">
            <span class="badge">NEW</span>
          </div>
          <div class="card-content">
            <div class="card-header">
              <h2>Minsk</h2>
              <span class="country">Belarus</span>
            </div>
            <p>The capital of Belarus.</p>
            <div class="card-footer">
              <span class="price">$450</span>
              <a href="cities.html?name=minsk" class="buy-btn" style="text-decoration: none;">more</a>
            </div>
          </div>
        </div>
      </div>


    </div>
  </main>


  <footer class="main-footer">
    <div class="footer-container">
      <div class="footer-column">
        <h4>Wizz Air</h4>
        <a href="./about_us.html">О нас</a>
        <a href="./vacancy.html">Вакансии</a>
      </div>
      <div class="footer-column">
        <h4>Услуги</h4>
        <a href="./form.html">Регистрация</a>
        <a href="./baggage.html">Багаж</a>
      </div>
      <div class="footer-social">
        <p>Следите за нами:</p>
        <div class="social-icons">
          <a href="https://www.youtube.com/c/WizzAir">FB</a>
        </div>
      </div>
    </div>
   
  <script src="./scripts/script.js"></script>
</body>
</html>
